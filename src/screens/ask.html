<section class="hub screen ask-screen" id="ask" aria-label="Ask">
  <div class="screen-head ask-head">
    <p class="eyebrow">Ask</p>
    <h2>Ask TreebySound</h2>
    <p class="screen-lead">Set something up, test it, fix it, or look it up — in your own words. Works offline; nothing leaves your phone.</p>
  </div>
    <div class="chat" id="faultChat">
      <div class="chat-bar">
        <p class="chat-title">Offline · private to this phone</p>
        <button type="button" class="chat-reset" id="chatReset">Start over</button>
      </div>
      <div class="chat-log" id="chatLog" role="log" aria-live="polite" aria-label="Fault finder conversation"></div>
      <div class="chat-chips" id="chatChips"></div>
      <form class="chat-form" id="chatForm" autocomplete="off">
        <label class="sr-only" for="chatInput">Describe the problem</label>
        <textarea id="chatInput" rows="1" placeholder="What's going on?"></textarea>
        <button type="submit" class="chat-send" id="chatSend">Send</button>
      </form>
      <p class="chat-foot">A second opinion, not an authority — electrical, rigging and other people's systems go to the person responsible. <a href="#support-now">Make it safe</a></p>
    </div>
</section>
